<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>路面状态识别系统</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 26px 16px 60px;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #eef2f7; color: #1b2430; font-size: 18px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 32px; margin: 0 0 6px; letter-spacing: 1px; }
  .sub { color: #5a6a7d; font-size: 17px; margin-bottom: 22px; line-height: 1.7; }
  .card {
    background: #fff; border-radius: 16px; padding: 24px 22px;
    box-shadow: 0 6px 22px rgba(24, 43, 74, .08); margin-bottom: 22px;
  }
  .card h2 { font-size: 23px; margin: 0 0 18px; }
  #drop {
    border: 3px dashed #b7c6da; border-radius: 14px; padding: 34px 20px;
    text-align: center; color: #56677d; font-size: 19px; cursor: pointer;
    transition: .15s; background: #f7fafd;
  }
  #drop.hot { border-color: #2f6fed; background: #eaf1ff; color: #1b4fc4; }
  #drop b { color: #2f6fed; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
  button {
    font-size: 19px; padding: 13px 26px; border-radius: 10px; border: 0;
    background: #2f6fed; color: #fff; cursor: pointer; font-family: inherit;
  }
  button.ghost { background: #eef3fb; color: #2f6fed; border: 1px solid #c9dbf7; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .thumbs { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .thumb { width: 120px; height: 120px; border-radius: 12px; overflow: hidden; position: relative; border: 2px solid transparent; cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb span {
    position: absolute; left: 0; right: 0; bottom: 0; background: rgba(16,28,45,.72);
    color: #fff; font-size: 14px; text-align: center; padding: 3px 0;
  }
  #stage { display: none; gap: 24px; align-items: flex-start; margin-top: 8px; flex-wrap: wrap; }
  #stage.on { display: flex; }
  #preview { width: 300px; max-width: 100%; border-radius: 12px; border: 1px solid #e2e9f3; }
  .result { flex: 1; min-width: 260px; }
  .verdict { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
  .conf { color: #5a6a7d; margin-bottom: 18px; font-size: 16px; word-break: break-all; }
  .bar { margin-bottom: 14px; }
  .bar .name { display: flex; justify-content: space-between; font-size: 17px; margin-bottom: 6px; }
  .bar .track { height: 16px; background: #eef2f7; border-radius: 8px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: #2f6fed; border-radius: 8px; transition: width .35s; }
  .bar.top .fill { background: #18a058; }
  .bar.top .name { font-weight: 700; }
  .tip { color: #6b7c92; font-size: 16px; line-height: 1.9; }
  .tip b { color: #1b2430; }
  #status { font-size: 17px; color: #2f6fed; margin-top: 14px; min-height: 24px; }
  .err { color: #e5484d; }
  .foot { color: #7b8ca3; font-size: 15px; text-align: center; margin-top: 10px; line-height: 1.9; }
</style>
</head>
<body>
<div class="wrap">
  <h1>路面状态识别系统</h1>
  <div class="sub">网页版 · 手机电脑都能打开 · 照片只在你自己的浏览器里处理，不会上传到任何服务器</div>

  <div class="card">
    <h2>1. 放入照片</h2>
    <div id="drop">把路面照片拖到这里，或 <b>点击选择文件</b><br><span style="font-size:16px;color:#8296ad">支持一次多张，格式 jpg / png；手机上点这里可以调用相册或拍照</span></div>
    <div class="row">
      <button id="pick" class="ghost">选择文件</button>
      <button id="demo" class="ghost">用示例照片试一下</button>
      <button id="clear" class="ghost">清空</button>
      <input id="file" type="file" accept="image/*" multiple hidden />
    </div>
    <div class="thumbs" id="thumbs"></div>
    <div id="status">模型加载中…（第一次打开要下载约 10MB 的识别模型，等十几秒就好）</div>
  </div>

  <div class="card">
    <h2>2. 识别结果</h2>
    <div id="stage">
      <img id="preview" alt="预览" />
      <div class="result">
        <div class="verdict" id="verdict">—</div>
        <div class="conf" id="conf"></div>
        <div id="bars"></div>
      </div>
    </div>
    <div class="tip" id="tipbox" style="display:none">
      <b>怎么判读：</b>第一名的概率越高越可信。若两类概率接近（相差不到 15%），说明这张图介于两者之间，建议换一张更清楚、离得更近的照片再拍一次。
    </div>
  </div>

  <div class="foot">
    类别：裂缝 / 完好 / 坑洞 / 修补　·　模型：ResNet18（ONNX，浏览器本地运行）
  </div>
</div>

<script>
const ORT_BASES = [
  "https://registry.npmmirror.com/onnxruntime-web/1.19.2/files/dist/",
  "https://fastly.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/"
];
const CN = { crack: "裂缝", normal: "路面完好", pothole: "坑洞", repair: "修补过" };
const CLASS_NAMES = ["crack", "normal", "pothole", "repair"];
const MEAN = [0.485, 0.456, 0.406];
const STD = [0.229, 0.224, 0.225];
const SAMPLES = {};

const dropEl = document.getElementById("drop");
const fileEl = document.getElementById("file");
const statusEl = document.getElementById("status");
const thumbsEl = document.getElementById("thumbs");
const stageEl = document.getElementById("stage");
const previewEl = document.getElementById("preview");
const verdictEl = document.getElementById("verdict");
const confEl = document.getElementById("conf");
const barsEl = document.getElementById("bars");
const tipEl = document.getElementById("tipbox");
const SIZE = 512;
let session = null, busy = false;

// 示例照片统一从隐藏的 img 元素取，路径只写在 src 里
["crack", "normal", "pothole", "repair"].forEach(function (k) {
  const el = document.getElementById("sp-" + k);
  if (el) SAMPLES[k] = el.getAttribute("src");
});

function setStatus(t, isErr) {
  statusEl.textContent = t;
  statusEl.className = isErr ? "err" : "";
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error("引擎脚本下载失败"));
    document.head.appendChild(s);
  });
}

async function init() {
  const MODEL_URLS = [
    "https://raw.githubusercontent.com/zzz0834/zzz0834.github.io/main/model.onnx",
    "https://ghfast.top/https://raw.githubusercontent.com/zzz0834/zzz0834.github.io/main/model.onnx",
    "model.onnx"
  ];
  let bytes = null;
  for (let i = 0; i < MODEL_URLS.length; i++) {
    try {
      setStatus("正在下载识别模型…（约 10MB，第 " + (i + 1) + " 个源）");
      const resp = await fetch(MODEL_URLS[i], { cache: "force-cache" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      bytes = new Uint8Array(await resp.arrayBuffer());
      break;
    } catch (e) {
      bytes = null;
    }
  }
  if (!bytes) { setStatus("模型下载失败，请检查网络后刷新页面重试", true); return; }
  let lastErr = null;
  for (const base of ORT_BASES) {
    try {
      if (typeof ort === "undefined") await loadScript(base + "ort.wasm.min.js");
      if (typeof ort === "undefined") throw new Error("引擎脚本没加载成功");
      ort.env.wasm.numThreads = 1;
      ort.env.wasm.wasmPaths = base;
      session = await ort.InferenceSession.create(bytes, { executionProviders: ["wasm"] });
      lastErr = null;
      break;
    } catch (e) {
      lastErr = e;
      session = null;
    }
  }
  if (session) {
    setStatus("模型已就绪，可以开始识别（" + CLASS_NAMES.map(c => CN[c] || c).join(" / ") + "）");
    if (new URLSearchParams(location.search).get("selftest") === "1") runSelfTest();
  } else {
    setStatus("识别引擎加载失败（" + (lastErr ? lastErr.message : "未知原因") + "）　→ 请检查网络后刷新页面重试", true);
  }
}

const canvas = document.createElement("canvas");
canvas.width = SIZE; canvas.height = SIZE;
const ctx = canvas.getContext("2d", { willReadFrequently: true });

function tensorFromImage(img) {
  ctx.drawImage(img, 0, 0, SIZE, SIZE);
  const px = ctx.getImageData(0, 0, SIZE, SIZE).data;
  const n = SIZE * SIZE;
  const data = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    const r = px[i * 4] / 255, g = px[i * 4 + 1] / 255, b = px[i * 4 + 2] / 255;
    data[i] = (r - MEAN[0]) / STD[0];
    data[n + i] = (g - MEAN[1]) / STD[1];
    data[2 * n + i] = (b - MEAN[2]) / STD[2];
  }
  return new ort.Tensor("float32", data, [1, 3, SIZE, SIZE]);
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error("图片打不开"));
    im.src = src;
  });
}

function softmax(a) {
  const m = Math.max(...a);
  const ex = a.map(v => Math.exp(v - m));
  const s = ex.reduce((x, y) => x + y, 0);
  return ex.map(v => v / s);
}

function outName(o) {
  const keys = Object.keys(o);
  for (const k of keys) if (k.toLowerCase().indexOf("logit") >= 0) return k;
  return keys[0];
}

async function recognize(src, name) {
  if (!session) { setStatus("模型还没加载好，稍等一下或检查上面的报错", true); return; }
  if (busy) return;
  busy = true;
  setStatus("正在识别…");
  try {
    const img = await loadImage(src);
    const t0 = performance.now();
    const feeds = {};
    feeds["input"] = tensorFromImage(img);
    const out = await session.run(feeds);
    const logits = Array.from(out[outName(out)].data);
    const probs = softmax(logits);
    const t = Math.round(performance.now() - t0);
    const best = probs.indexOf(Math.max(...probs));

    previewEl.src = src;
    verdictEl.textContent = CN[CLASS_NAMES[best]] || CLASS_NAMES[best];
    verdictEl.style.color = best === 2 ? "#e5484d" : (best === 0 ? "#d4820a" : "#18a058");
    confEl.textContent = "置信度 " + (probs[best] * 100).toFixed(1) + "%　·　用时 " + t + " ms　·　文件 " + name;

    barsEl.innerHTML = "";
    probs.forEach((p, i) => {
      const div = document.createElement("div");
      div.className = "bar" + (i === best ? " top" : "");
      div.innerHTML =
        '<div class="name"><span>' + (CN[CLASS_NAMES[i]] || CLASS_NAMES[i]) + '</span><span>' +
        (p * 100).toFixed(1) + '%</span></div>' +
        '<div class="track"><div class="fill" style="width:' + (p * 100).toFixed(1) + '%"></div></div>';
      barsEl.appendChild(div);
    });

    const sorted = probs.slice().sort((a, b) => b - a);
    tipEl.style.display = "block";
    tipEl.innerHTML = (sorted[0] - sorted[1] < 0.15)
      ? "<b>提示：</b>前两名概率很接近（差 " + ((sorted[0] - sorted[1]) * 100).toFixed(1) + "%），这张图不太好判断，建议换更清楚的近景照片。"
      : "<b>提示：</b>结论比较明确，可以把这张图当作「" + (CN[CLASS_NAMES[best]] || CLASS_NAMES[best]) + "」样本存档。";

    stageEl.classList.add("on");
    setStatus("识别完成");
  } catch (e) {
    setStatus("识别失败：" + e.message, true);
  } finally {
    busy = false;
  }
}

function handleFiles(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  thumbsEl.innerHTML = "";
  list.slice(0, 12).forEach((f) => {
    const div = document.createElement("div");
    div.className = "thumb";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(f);
    const span = document.createElement("span");
    span.textContent = f.name.length > 12 ? f.name.slice(0, 10) + "…" : f.name;
    div.appendChild(img); div.appendChild(span);
    div.onclick = () => recognize(img.src, f.name);
    thumbsEl.appendChild(div);
  });
  recognize(URL.createObjectURL(list[0]), list[0].name);
}

dropEl.onclick = () => fileEl.click();
document.getElementById("pick").onclick = () => fileEl.click();
fileEl.onchange = (e) => handleFiles(e.target.files);
document.getElementById("clear").onclick = () => {
  thumbsEl.innerHTML = ""; stageEl.classList.remove("on"); tipEl.style.display = "none";
  setStatus("已清空，可以继续放新照片");
};
document.getElementById("demo").onclick = async () => {
  const names = ["crack", "normal", "pothole", "repair"];
  thumbsEl.innerHTML = "";
  for (const n of names) {
    const src = SAMPLES[n];
    const div = document.createElement("div");
    div.className = "thumb";
    div.innerHTML = '<img src="' + src + '"><span>' + (CN[n] || n) + '</span>';
    div.onclick = () => recognize(src, n + ".jpg（示例）");
    thumbsEl.appendChild(div);
  }
  await recognize(SAMPLES.crack, "crack.jpg（示例）");
};

async function runSelfTest() {
  const names = ["crack", "normal", "pothole", "repair"];
  const parts = [];
  for (const n of names) {
    try {
      const img = await loadImage(SAMPLES[n]);
      const t0 = performance.now();
      const out = await session.run({ input: tensorFromImage(img) });
      const probs = softmax(Array.from(out[outName(out)].data));
      const best = probs.indexOf(Math.max(...probs));
      const ms = Math.round(performance.now() - t0);
      parts.push(n + "→" + CLASS_NAMES[best] + " " + (probs[best] * 100).toFixed(0) + "%/" + ms + "ms");
    } catch (e) {
      parts.push(n + "→ERR " + e.message);
    }
  }
  document.title = "SELFTEST " + parts.join(" | ");
}

["dragenter", "dragover"].forEach(ev => dropEl.addEventListener(ev, (e) => {
  e.preventDefault(); dropEl.classList.add("hot");
}));
["dragleave", "drop"].forEach(ev => dropEl.addEventListener(ev, (e) => {
  e.preventDefault(); dropEl.classList.remove("hot");
}));
dropEl.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));

init();
</script>
</body>
